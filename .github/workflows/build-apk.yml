name: Build Android APK (Offline Standalone)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 验证 Android SDK 环境
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"

      - name: 安装项目依赖
        run: npm install

      - name: 预生成 Android 原生工程 (Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 配置 Release 签名与离线打包
        run: |
          # 1. 让 release 构建直接借用 debug 密钥完成签名，确保脱机安装可运行
          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          # 给 release buildTypes 增加 debug 签名配置与关闭混淆以防崩溃
          old_block = 'buildTypes {'
          new_block = '''buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }'''
          if 'signingConfig signingConfigs.debug' not in content:
              content = content.replace(old_block, new_block, 1)

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)

          # 2. 给 AndroidManifest.xml 注入 requestLegacyExternalStorage 提高兼容性
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              m_content = f.read()
          if 'requestLegacyExternalStorage' not in m_content:
              m_content = m_content.replace('<application', '<application android:requestLegacyExternalStorage=\"true\"', 1)
              with open(manifest_path, 'w') as f:
                  f.write(m_content)
          "
          echo "build.gradle 与 AndroidManifest 配置完成"

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 编译独立离线 Android APK (assembleRelease)
        run: |
          cd android
          # assembleRelease 会自动触发 createBundleReleaseJsAndAssets 生成离线 JS bundle 并打包进 APK
          ./gradlew assembleRelease --no-daemon

      - name: 归档并验证生成的 APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/*.apk release-output/Photomanager-v2.2.0.apk
          ls -lh release-output/

      - name: 上传 APK 安装包至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Photomanager-Android-Offline-APK-v2.2.0
          path: release-output/Photomanager-v2.2.0.apk
          retention-days: 14
